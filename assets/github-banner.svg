<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="45%" stop-color="#0d1128"/>
      <stop offset="75%" stop-color="#161b3a"/>
      <stop offset="100%" stop-color="#1f2547"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfd8ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8891c9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8891c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cityFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#e8ecff">
    <circle cx="60" cy="40" r="1.4" opacity="0.9"/>
    <circle cx="130" cy="80" r="1" opacity="0.7"/>
    <circle cx="200" cy="30" r="1.6" opacity="0.8"/>
    <circle cx="310" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="400" cy="25" r="1.3" opacity="0.9"/>
    <circle cx="480" cy="70" r="1" opacity="0.5"/>
    <circle cx="90" cy="120" r="0.9" opacity="0.6"/>
    <circle cx="250" cy="100" r="1.2" opacity="0.7"/>
    <circle cx="700" cy="35" r="1.5" opacity="0.8"/>
    <circle cx="780" cy="70" r="1" opacity="0.6"/>
    <circle cx="850" cy="20" r="1.3" opacity="0.9"/>
    <circle cx="920" cy="55" r="1" opacity="0.5"/>
    <circle cx="1000" cy="30" r="1.6" opacity="0.85"/>
    <circle cx="1070" cy="75" r="1.1" opacity="0.6"/>
    <circle cx="1140" cy="40" r="1.3" opacity="0.8"/>
    <circle cx="600" cy="90" r="0.9" opacity="0.5"/>
    <circle cx="550" cy="45" r="1.2" opacity="0.7"/>
    <circle cx="1160" cy="110" r="1" opacity="0.6"/>
    <circle cx="40" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="1180" cy="150" r="0.9" opacity="0.5"/>
  </g>

  <!-- Moon -->
  <circle cx="1000" cy="65" r="55" fill="url(#moonGlow)"/>
  <circle cx="1000" cy="65" r="22" fill="#eef1ff" opacity="0.95"/>
  <circle cx="1010" cy="58" r="22" fill="#0d1128" opacity="0.85"/>

  <!-- City / skyline silhouette -->
  <g fill="#05050a">
    <rect x="0" y="230" width="40" height="70"/>
    <rect x="45" y="205" width="30" height="95"/>
    <rect x="80" y="245" width="50" height="55"/>
    <rect x="135" y="190" width="25" height="110"/>
    <rect x="165" y="220" width="35" height="80"/>
    <rect x="205" y="250" width="45" height="50"/>
    <rect x="255" y="200" width="28" height="100"/>
    <rect x="290" y="235" width="40" height="65"/>
    <rect x="335" y="215" width="30" height="85"/>
    <rect x="370" y="255" width="55" height="45"/>
    <rect x="430" y="195" width="26" height="105"/>
    <rect x="460" y="240" width="42" height="60"/>
    <polygon points="145,190 150,170 155,190"/>
    <polygon points="440,195 445,175 450,195"/>

    <rect x="720" y="240" width="38" height="60"/>
    <rect x="765" y="210" width="28" height="90"/>
    <rect x="800" y="255" width="48" height="45"/>
    <rect x="855" y="195" width="24" height="105"/>
    <rect x="885" y="230" width="34" height="70"/>
    <rect x="925" y="215" width="30" height="85"/>
    <polygon points="865,195 869,178 873,195"/>
    <rect x="1090" y="235" width="36" height="65"/>
    <rect x="1130" y="205" width="26" height="95"/>
    <rect x="1160" y="250" width="40" height="50"/>
  </g>
  <rect x="0" y="180" width="1200" height="120" fill="url(#cityFade)" opacity="0.35"/>

  <!-- Text -->
  <text x="600" y="140" text-anchor="middle" font-family="'Fira Code', monospace" font-size="42" font-weight="700" fill="#eef1ff" filter="url(#softGlow)">
    Bem-vindo(a) ao meu perfil!
  </text>
  <text x="600" y="178" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" font-style="italic" fill="#8891c9">
    "Na escuridão, o código também brilha."
  </text>
</svg>
