<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1440 220"
     preserveAspectRatio="none">

    <defs>

        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0D1117"/>
            <stop offset="100%" stop-color="#0D1117"/>
        </linearGradient>

        <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#6D5BD0"/>
        </linearGradient>

        <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6F5ED8"/>
            <stop offset="100%" stop-color="#5F52C8"/>
        </linearGradient>

        <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>

    </defs>

    <!-- Fundo -->

    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Primeira onda -->

    <path fill="url(#wave1)" opacity=".70">

        <animate attributeName="d"
                 dur="18s"
                 repeatCount="indefinite"
                 values="
M0,90 C250,50 450,120 720,90 C980,60 1180,110 1440,70 L1440,220 L0,220 Z;

M0,100 C300,40 520,110 760,80 C980,60 1160,100 1440,90 L1440,220 L0,220 Z;

M0,90 C250,50 450,120 720,90 C980,60 1180,110 1440,70 L1440,220 L0,220 Z
"/>

    </path>

    <!-- Segunda onda -->

    <path fill="url(#wave2)" opacity=".55">

        <animate attributeName="d"
                 dur="12s"
                 repeatCount="indefinite"
                 values="
M0,120 C300,80 500,140 760,120 C980,100 1200,140 1440,110 L1440,220 L0,220 Z;

M0,110 C280,70 520,150 760,110 C980,90 1200,120 1440,100 L1440,220 L0,220 Z;

M0,120 C300,80 500,140 760,120 C980,100 1200,140 1440,110 L1440,220 L0,220 Z
"/>

    </path>

    <!-- Terceira onda -->

    <path fill="url(#wave3)" opacity=".35">

        <animate attributeName="d"
                 dur="9s"
                 repeatCount="indefinite"
                 values="
M0,140 C280,120 520,160 760,140 C980,120 1200,170 1440,150 L1440,220 L0,220 Z;

M0,150 C320,100 500,170 760,130 C980,110 1180,150 1440,140 L1440,220 L0,220 Z;

M0,140 C280,120 520,160 760,140 C980,120 1200,170 1440,150 L1440,220 L0,220 Z
"/>

    </path>

</svg>